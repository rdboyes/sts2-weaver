<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <defs>
    <pattern id="weave" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="#2a1a40"/>
      <rect y="6" width="80" height="28" fill="#b98cff"/><rect y="46" width="80" height="28" fill="#b98cff"/>
      <rect x="6" width="28" height="80" fill="#e8dcff"/><rect x="46" width="28" height="80" fill="#e8dcff"/>
      <rect y="6" width="40" height="28" fill="#b98cff"/><rect x="40" y="46" width="40" height="28" fill="#b98cff"/>
    </pattern>
    <radialGradient id="shade" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <path id="shield" d="M500,90 C600,130 690,140 760,130 C770,380 700,560 500,680 C300,560 230,380 240,130 C310,140 400,130 500,90 Z" fill="url(#weave)"/>
  </g>
  <path d="M500,90 C600,130 690,140 760,130 C770,380 700,560 500,680 C300,560 230,380 240,130 C310,140 400,130 500,90 Z" fill="url(#shade)"/>
  <path d="M500,90 C600,130 690,140 760,130 C770,380 700,560 500,680 C300,560 230,380 240,130 C310,140 400,130 500,90 Z" fill="none" stroke="#ffd27a" stroke-width="18" stroke-linejoin="round"/>
  <path d="M500,120 L500,650" stroke="#ffd27a" stroke-width="8" opacity="0.7"/>
</svg>
