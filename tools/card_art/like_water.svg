<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <defs>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8fbff"/><stop offset="1" stop-color="#3aa0c8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- a wave made of threads -->
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M-20,560 C150,560 200,300 380,300 C560,300 520,520 420,520 C340,520 360,420 430,420" stroke="#7fd4f0" stroke-width="16"/>
    <path d="M-20,610 C180,610 240,340 400,250 C600,150 720,380 600,500 C540,560 470,520 480,470" stroke="#b98cff" stroke-width="12"/>
    <path d="M-20,660 C220,660 300,420 460,330 C680,210 900,300 880,520 C870,620 760,640 740,580" stroke="#4fb6dc" stroke-width="14"/>
    <path d="M-20,710 C300,710 480,560 700,600 C860,630 920,700 1020,700" stroke="#2c86b0" stroke-width="12"/>
  </g>
  <!-- droplets -->
  <g fill="url(#drop)" stroke="#e8fbff" stroke-width="3">
    <path d="M700,140 C700,140 740,200 740,225 A40,40 0 0 1 660,225 C660,200 700,140 700,140 Z"/>
    <path d="M820,260 C820,260 845,300 845,315 A25,25 0 0 1 795,315 C795,300 820,260 820,260 Z"/>
    <path d="M590,110 C590,110 608,140 608,150 A18,18 0 0 1 572,150 C572,140 590,110 590,110 Z"/>
  </g>
</svg>
