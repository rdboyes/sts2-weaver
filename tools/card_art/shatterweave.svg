<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/><stop offset="0.5" stop-color="#c8f7ff" stop-opacity="0.45"/><stop offset="1" stop-color="#6ccde8" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="url(#glass)" stroke="#e8fdff" stroke-width="4" stroke-linejoin="round" filter="url(#glow)">
    <path d="M500,380 L330,130 L560,110 Z"/>
    <path d="M520,370 L600,120 L800,250 Z"/>
    <path d="M530,395 L820,290 L760,520 Z"/>
    <path d="M510,410 L720,560 L470,660 Z"/>
    <path d="M485,405 L430,660 L210,520 Z"/>
    <path d="M475,385 L190,470 L250,220 Z"/>
    <path d="M150,170 L230,150 L200,230 Z" opacity="0.7"/>
    <path d="M850,560 L900,620 L820,640 Z" opacity="0.7"/>
    <path d="M880,160 L930,190 L870,220 Z" opacity="0.6"/>
  </g>
  <!-- threads stitching the shards back together -->
  <g fill="none" stroke="#b98cff" stroke-width="7" stroke-linecap="round">
    <path d="M420,170 C470,200 560,190 620,180"/>
    <path d="M700,240 C740,290 760,330 760,360"/>
    <path d="M700,460 C660,520 640,560 600,600"/>
    <path d="M440,600 C380,580 320,560 280,520"/>
    <path d="M260,420 C250,350 260,300 280,260"/>
  </g>
  <circle cx="500" cy="385" r="18" fill="#fff" filter="url(#glow)"/>
</svg>
