<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6a2a"/><stop offset="0.45" stop-color="#fff2c8"/><stop offset="1" stop-color="#9a7a3a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- resonant arcs -->
  <g fill="none" stroke="#ffd27a" stroke-linecap="round" filter="url(#glow)">
    <path d="M380,200 A170,170 0 0 0 380,460" stroke-width="10" opacity="0.9"/>
    <path d="M620,200 A170,170 0 0 1 620,460" stroke-width="10" opacity="0.9"/>
    <path d="M300,140 A260,260 0 0 0 300,520" stroke-width="7" opacity="0.6"/>
    <path d="M700,140 A260,260 0 0 1 700,520" stroke-width="7" opacity="0.6"/>
    <path d="M220,80 A350,350 0 0 0 220,580" stroke-width="5" opacity="0.35"/>
    <path d="M780,80 A350,350 0 0 1 780,580" stroke-width="5" opacity="0.35"/>
  </g>
  <!-- tuning fork -->
  <path d="M455,90 L455,400 A45,45 0 0 0 545,400 L545,90 L520,90 L520,395 A20,20 0 0 1 480,395 L480,90 Z" fill="url(#steel)" stroke="#3a2a0a" stroke-width="5"/>
  <rect x="488" y="440" width="24" height="230" rx="12" fill="url(#steel)" stroke="#3a2a0a" stroke-width="5"/>
  <!-- the five alignments, humming along -->
  <g stroke="#fff" stroke-width="3" filter="url(#glow)">
    <circle cx="160" cy="330" r="26" fill="#9fe8ff"/>
    <circle cx="840" cy="330" r="26" fill="#bfefff"/>
    <circle cx="250" cy="640" r="26" fill="#ff8ce6"/>
    <circle cx="750" cy="640" r="26" fill="#8a5be0"/>
    <circle cx="500" cy="720" r="22" fill="#c8f7ff"/>
  </g>
</svg>
