<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3518"/><stop offset="0.5" stop-color="#b07a45"/><stop offset="1" stop-color="#5a3518"/>
    </linearGradient>
  </defs>
  <!-- spool -->
  <g transform="translate(200,380)">
    <rect x="-70" y="-120" width="140" height="240" fill="#b98cff"/>
    <g stroke="#7d55c4" stroke-width="5">
      <path d="M-70,-90 L70,-90 M-70,-50 L70,-50 M-70,-10 L70,-10 M-70,30 L70,30 M-70,70 L70,70"/>
    </g>
    <rect x="-100" y="-150" width="200" height="34" rx="10" fill="url(#wood)" stroke="#2b1708" stroke-width="5"/>
    <rect x="-100" y="116" width="200" height="34" rx="10" fill="url(#wood)" stroke="#2b1708" stroke-width="5"/>
  </g>
  <!-- thread turning into a lightning bolt -->
  <path d="M270,330 C330,300 360,300 400,320 L520,220 L480,380 L640,300 L580,460 L820,360" fill="none" stroke="#9fe8ff" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M270,330 C330,300 360,300 400,320 L520,220 L480,380 L640,300 L580,460 L820,360" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#e8fbff" filter="url(#glow)">
    <circle cx="840" cy="350" r="22"/>
    <path d="M880,300 l12,-30 M880,400 l20,24 M900,350 l34,0" stroke="#e8fbff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="560" cy="200" r="6"/><circle cx="700" cy="470" r="7"/><circle cx="430" cy="440" r="5"/>
  </g>
</svg>
