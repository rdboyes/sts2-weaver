<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f7c8c"/><stop offset="0.45" stop-color="#ffffff"/><stop offset="1" stop-color="#7d8a9a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- thread loop behind the needle -->
  <path d="M500,150 C380,120 300,230 360,330 S640,420 600,560 S380,700 300,640" fill="none" stroke="#b98cff" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  <!-- needle, eye at top -->
  <path d="M478,90 A22,22 0 0 1 522,90 L516,600 L500,705 L484,600 Z" fill="url(#steel)" stroke="#2b3440" stroke-width="4"/>
  <rect x="493" y="80" width="14" height="70" rx="7" fill="#2a0a12"/>
  <!-- thread through the eye -->
  <path d="M500,150 C560,150 610,110 640,70" fill="none" stroke="#b98cff" stroke-width="12" stroke-linecap="round"/>
  <!-- gleam at the tip -->
  <g filter="url(#glow)" fill="#fff">
    <path d="M500,665 L510,700 L545,710 L510,720 L500,755 L490,720 L455,710 L490,700 Z"/>
  </g>
</svg>
