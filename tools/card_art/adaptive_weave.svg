<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <defs>
    <linearGradient id="shift" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fe8ff"/><stop offset="0.3" stop-color="#bfefff"/><stop offset="0.55" stop-color="#ff8ce6"/><stop offset="0.8" stop-color="#8a5be0"/><stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <pattern id="weave" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#000" fill-opacity="0.55"/>
      <rect y="5" width="60" height="20" fill="#fff" fill-opacity="0.15"/><rect y="35" width="60" height="20" fill="#fff" fill-opacity="0.15"/>
      <rect x="5" width="20" height="60" fill="#fff" fill-opacity="0.4"/><rect x="35" width="20" height="60" fill="#fff" fill-opacity="0.4"/>
      <rect y="5" width="30" height="20" fill="#fff" fill-opacity="0.15"/><rect x="30" y="35" width="30" height="20" fill="#fff" fill-opacity="0.15"/>
    </pattern>
    <clipPath id="hex"><path d="M500,80 L760,230 L760,530 L500,680 L240,530 L240,230 Z"/></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <path d="M500,80 L760,230 L760,530 L500,680 L240,530 L240,230 Z" fill="url(#shift)" filter="url(#glow)"/>
  <g clip-path="url(#hex)">
    <rect width="1000" height="760" fill="url(#weave)" style="mix-blend-mode:multiply"/>
  </g>
  <path d="M500,80 L760,230 L760,530 L500,680 L240,530 L240,230 Z" fill="none" stroke="#f1e6ff" stroke-width="12" stroke-linejoin="round"/>
  <!-- rotating arrows: the weave adapts -->
  <g fill="none" stroke="#f1e6ff" stroke-width="14" stroke-linecap="round" filter="url(#glow)">
    <path d="M410,300 A110,110 0 0 1 610,320"/><path d="M590,460 A110,110 0 0 1 390,440"/>
  </g>
  <g fill="#f1e6ff"><path d="M635,290 L620,355 L575,305 Z"/><path d="M365,470 L380,405 L425,455 Z"/></g>
</svg>
