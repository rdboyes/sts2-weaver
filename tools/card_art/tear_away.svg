<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <defs>
    <pattern id="weave" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#2a1a40"/>
      <rect y="5" width="60" height="20" fill="#9a6ee0"/><rect y="35" width="60" height="20" fill="#9a6ee0"/>
      <rect x="5" width="20" height="60" fill="#d9c2ff"/><rect x="35" width="20" height="60" fill="#d9c2ff"/>
      <rect y="5" width="30" height="20" fill="#9a6ee0"/><rect x="30" y="35" width="30" height="20" fill="#9a6ee0"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="14" stdDeviation="10" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- left half stays -->
  <g filter="url(#shadow)">
    <path d="M150,140 L470,130 L440,200 L490,260 L430,330 L480,400 L420,470 L470,540 L430,620 L160,630 Z" fill="url(#weave)" transform="rotate(-6 300 380)"/>
  </g>
  <!-- right half pulled away -->
  <g filter="url(#shadow)" transform="translate(110,-30) rotate(10 700 380)">
    <path d="M530,130 L850,140 L840,630 L560,620 L520,540 L570,470 L510,400 L560,330 L500,260 L550,200 Z" fill="url(#weave)"/>
  </g>
  <!-- loose threads across the gap -->
  <g fill="none" stroke="#d9c2ff" stroke-width="6" stroke-linecap="round">
    <path d="M455,250 C500,260 540,230 560,190"/><path d="M450,390 C520,400 560,380 600,340"/>
    <path d="M445,520 C500,560 560,520 620,500"/><path d="M460,320 C490,340 500,360 490,400"/>
    <path d="M440,600 C470,640 520,650 540,700"/>
  </g>
</svg>
